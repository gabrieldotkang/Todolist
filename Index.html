<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- PWA 전체 화면 및 테마 설정 -->
  <meta name="theme-color" content="#4F46E5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="메이트 To-Do">
  <title>나의 AI 메이트 To-Do</title>

  <!-- 동적 매니페스트 및 아이콘 연결 링크 -->
  <link id="dynamicManifest" rel="manifest">
  <link id="dynamicFavicon" rel="icon" type="image/png">
  <link id="dynamicAppleIcon" rel="apple-touch-icon">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
    body { 
      font-family: 'Pretendard', sans-serif; 
      background-color: #F3F4F6; 
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .character-bounce { animation: bounce 2s infinite; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .pulse-ring { animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col pb-24 shadow-lg bg-gray-50">

  <!-- 상단 헤더 & 상태 표시줄 -->
  <header class="bg-indigo-600 text-white p-3.5 sticky top-0 z-20 shadow-md">
    <div class="flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-lg font-bold">✨ 메이트 To-Do</span>
        <span id="storageBadge" class="text-[10px] bg-green-500 text-white px-2 py-0.5 rounded-full font-semibold">PWA 앱 모드</span>
      </div>
      <div class="flex items-center space-x-1.5">
        <!-- PWA 앱 설치 버튼 (설치 가능 시 자동 표시) -->
        <button id="pwaInstallBtn" onclick="installPWA()" class="hidden bg-amber-400 hover:bg-amber-500 text-indigo-950 font-bold text-xs px-2.5 py-1 rounded-full shadow animate-pulse">
          📲 앱 설치
        </button>
        <span id="currentDateDisplay" class="text-xs bg-indigo-500 px-2.5 py-1 rounded-full"></span>
      </div>
    </div>
    <!-- 알람 엔진 실시간 상태바 -->
    <div class="mt-2 pt-2 border-t border-indigo-500/60 flex justify-between items-center text-xs text-indigo-100">
      <div class="flex items-center space-x-1.5">
        <span class="w-2 h-2 rounded-full bg-green-400 pulse-ring"></span>
        <span id="alarmStatusText">알람 대기 중 (터치 시 소리 활성화)</span>
      </div>
      <button onclick="toggleWakeLock()" id="wakeLockBtn" class="bg-indigo-700 hover:bg-indigo-800 px-2 py-0.5 rounded text-[11px] font-semibold">
        💡 화면켜짐유지: OFF
      </button>
    </div>
  </header>

  <!-- 4. 캐릭터 독려 & 칭찬 영역 -->
  <section id="characterSection" class="bg-white p-3.5 m-3 rounded-2xl shadow-sm border border-indigo-100 flex items-center space-x-3.5">
    <div id="charAvatar" class="text-5xl character-bounce select-none cursor-pointer" onclick="triggerCharacterEncourage()">🤖</div>
    <div class="flex-1">
      <div class="flex justify-between items-center mb-1">
        <span id="charName" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">열정 코치 제이</span>
        <button onclick="testAudioAndVoice()" class="text-[11px] bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded font-semibold">🔊 소리/알람 테스트</button>
      </div>
      <p id="charBubble" class="text-xs text-gray-700 font-medium leading-relaxed">오늘도 목표를 향해 기분 좋게 출발해 볼까요? 할 일을 등록해 주세요!</p>
    </div>
  </section>

  <!-- 메인 컨텐츠 영역 -->
  <main class="flex-1 px-3">

    <!-- [탭 1] 할 일 관리 -->
    <div id="tab-todo" class="space-y-3.5">
      <div class="bg-white p-4 rounded-2xl shadow-sm space-y-3">
        <input id="todoInput" type="text" placeholder="할 일을 입력하세요 (예: 영어 회화 복습)" 
               class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500">
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-gray-500 mb-1">⏰ 목표 마감 시간</label>
            <input id="todoDeadline" type="time" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-xl text-sm font-semibold">
          </div>
          <div id="alarmIntervalBox">
            <label class="block text-xs text-gray-500 mb-1">🔔 사전 독려 주기</label>
            <select id="todoInterval" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-xl text-sm">
              <option value="1">1분마다 (즉시 테스트용)</option>
              <option value="5">5분마다</option>
              <option value="10">10분마다</option>
              <option value="15">15분마다</option>
              <option value="30" selected>30분마다</option>
              <option value="60">60분마다</option>
            </select>
          </div>
        </div>

        <button onclick="addTodo()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow">
          + 할 일 등록 & 알람 시작
        </button>
      </div>

      <!-- 오늘 진행률 요약 바 -->
      <div id="quickProgressBox" class="bg-indigo-50 p-3 rounded-xl flex items-center justify-between">
        <span class="text-xs font-semibold text-indigo-800">오늘의 달성률</span>
        <div class="w-1/2 bg-indigo-200 rounded-full h-2.5 overflow-hidden">
          <div id="todayProgressBar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <span id="todayProgressText" class="text-xs font-bold text-indigo-800">0% (0/0)</span>
      </div>

      <!-- 할 일 목록 리스트 -->
      <div id="todoListContainer" class="space-y-2.5 pb-6"></div>
    </div>

    <!-- [탭 2] 2. 완료 추이 통계 (일/주/월) -->
    <div id="tab-stats" class="hidden space-y-4 pb-6">
      <div class="bg-white p-4 rounded-2xl shadow-sm">
        <div class="flex space-x-2 mb-4">
          <button onclick="switchStatView('daily')" id="btnStatDaily" class="flex-1 py-1.5 text-xs font-bold rounded-lg bg-indigo-600 text-white">일간 현황</button>
          <button onclick="switchStatView('weekly')" id="btnStatWeekly" class="flex-1 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-600">주간 추이</button>
          <button onclick="switchStatView('monthly')" id="btnStatMonthly" class="flex-1 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-600">월간 추이</button>
        </div>
        <div class="relative h-56 flex items-center justify-center">
          <canvas id="statsChart"></canvas>
